services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_affairs
      POSTGRES_USER: personal_affairs
      POSTGRES_PASSWORD: personal_affairs
    ports:
      - "127.0.0.1:15444:5432"
    volumes:
      - personal_affairs_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_affairs -d personal_affairs"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      PERSONAL_AFFAIRS_APP_ENV: development
      PERSONAL_AFFAIRS_DATABASE_URL: postgresql://personal_affairs:personal_affairs@postgres:5432/personal_affairs
      PERSONAL_AFFAIRS_BOOTSTRAP_USERNAME: local
      PERSONAL_AFFAIRS_BOOTSTRAP_PASSWORD: local-password-change-me
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18098:8080"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["personal-affairs-worker"]
    environment:
      PERSONAL_AFFAIRS_APP_ENV: development
      PERSONAL_AFFAIRS_DATABASE_URL: postgresql://personal_affairs:personal_affairs@postgres:5432/personal_affairs
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    ports:
      - "127.0.0.1:18110:80"

volumes:
  personal_affairs_dev_pg:
