name: Bug report
description: Report a reproducible EventFlowOS defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private hostnames, personal exports, session cookies, database URLs, or webhook secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a local or test deployment when possible.
      placeholder: |
        1. Start from ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: commit SHA or release tag
  - type: textarea
    id: context
    attributes:
      label: Safe context
      description: Include non-sensitive logs, stack traces, browser console output, or screenshots after redaction.
