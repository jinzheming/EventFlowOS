name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_affairs
          POSTGRES_USER: personal_affairs
          POSTGRES_PASSWORD: personal_affairs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_affairs -d personal_affairs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PERSONAL_AFFAIRS_TEST_DATABASE_URL: postgresql://personal_affairs:personal_affairs@127.0.0.1:5432/personal_affairs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Verify backend
        run: ./scripts/verify-backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        env:
          RUN_E2E: "1"
        run: ./scripts/verify-frontend.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compose
        run: ./scripts/verify-compose.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple --build-arg UV_INDEX_URL=https://pypi.org/simple -f infra/Dockerfile.api .
      - name: Build web image
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org -f infra/Dockerfile.web .

  clean-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git diff --check
      - name: Ensure generated artifacts are not tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(node_modules|dist|\.venv|__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache)(/|$)' || true)
          if [ -n "$tracked" ]; then
            echo "Generated artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
