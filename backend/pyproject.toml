[project]
name = "personal-affairs"
version = "0.1.0"
description = "Self-hosted personal affairs manager API and reminder worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1.0,<24.0.0",
  "fastapi>=0.115.0,<0.116.0",
  "httpx>=0.27.0,<0.28.0",
  "mcp>=1.0.0,<2.0.0",
  "psycopg[binary,pool]>=3.2.0,<3.3.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-multipart>=0.0.9,<0.0.10",
  "pywebpush>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
  "ruff>=0.7.0,<0.8.0",
  "pyright==1.1.380",
]

[project.scripts]
personal-affairs-api = "personal_affairs.api.app:main"
personal-affairs-migrate = "personal_affairs.storage.migrations:main"
personal-affairs-worker = "personal_affairs.workers.reminder_worker:main"
personal-affairs-webhook-worker = "personal_affairs.workers.webhook_worker:main"
personal-affairs-mcp = "personal_affairs.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportArgumentType = "none"
reportCallIssue = "none"
reportReturnType = "none"
